name: CI

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run check
      - run: node --test
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
